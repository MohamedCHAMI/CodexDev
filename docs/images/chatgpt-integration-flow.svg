<svg width="740" height="340" viewBox="0 0 740 340" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="cardShadow" x="-10" y="0" width="760" height="360" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="740" height="340" rx="14" fill="#18181B"/>

  <!-- Step 1: ChatGPT -->
  <g transform="translate(30, 40)">
    <rect width="190" height="250" rx="10" fill="#27272A" stroke="#3F3F46" stroke-width="1"/>
    <rect width="190" height="40" rx="10" fill="#10A37F"/>
    <text x="95" y="25" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" text-anchor="middle">🧠 1. ChatGPT</text>
    <text x="95" y="70" fill="#E4E4E7" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" text-anchor="middle">User Prompt</text>
    <rect x="15" y="85" width="160" height="50" rx="6" fill="#18181B" stroke="#3F3F46"/>
    <text x="25" y="105" fill="#A1A1AA" font-family="monospace" font-size="10">"Inspect /chessspire</text>
    <text x="25" y="122" fill="#A1A1AA" font-family="monospace" font-size="10">and list its files"</text>
    
    <text x="95" y="165" fill="#71717A" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" text-anchor="middle">Sends request with</text>
    <rect x="25" y="175" width="140" height="24" rx="4" fill="#3F3F46"/>
    <text x="95" y="191" fill="#10A37F" font-family="monospace" font-size="10" font-weight="600" text-anchor="middle">Bearer Auth Token</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <g transform="translate(225, 140)">
    <path d="M 5 25 L 45 25" stroke="#10A37F" stroke-width="2" stroke-dasharray="4 4"/>
    <polygon points="45,21 53,25 45,29" fill="#10A37F"/>
  </g>

  <!-- Step 2: Cloudflare Tunnel -->
  <g transform="translate(280, 40)">
    <rect width="180" height="250" rx="10" fill="#27272A" stroke="#F6821F" stroke-width="1"/>
    <rect width="180" height="40" rx="10" fill="#F6821F"/>
    <text x="90" y="25" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" text-anchor="middle">🌉 2. Cloudflare Tunnel</text>
    <text x="90" y="70" fill="#E4E4E7" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Secure Ingress</text>
    
    <rect x="15" y="90" width="150" height="35" rx="6" fill="#18181B" stroke="#3F3F46"/>
    <text x="90" y="112" fill="#F6821F" font-family="monospace" font-size="9" text-anchor="middle">https://codex.domain/mcp</text>

    <text x="90" y="155" fill="#A1A1AA" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" text-anchor="middle">Blind Network Pipe</text>
    <text x="90" y="172" fill="#71717A" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" text-anchor="middle">No open router ports</text>
    <text x="90" y="188" fill="#71717A" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" text-anchor="middle">Zero local firewall holes</text>
    <text x="90" y="215" fill="#10A37F" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="600" text-anchor="middle">✓ End-to-End HTTPS</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <g transform="translate(465, 140)">
    <path d="M 5 25 L 45 25" stroke="#007AFF" stroke-width="2" stroke-dasharray="4 4"/>
    <polygon points="45,21 53,25 45,29" fill="#007AFF"/>
  </g>

  <!-- Step 3: Local Mac / Node MCP -->
  <g transform="translate(520, 40)">
    <rect width="190" height="250" rx="10" fill="#27272A" stroke="#3F3F46" stroke-width="1"/>
    <rect width="190" height="40" rx="10" fill="#007AFF"/>
    <text x="95" y="25" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" text-anchor="middle">🤖 3. Your Mac (CodexDev)</text>
    <text x="95" y="70" fill="#E4E4E7" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Local Execution</text>

    <rect x="15" y="90" width="160" height="30" rx="6" fill="#18181B" stroke="#3F3F46"/>
    <text x="95" y="110" fill="#A1A1AA" font-family="monospace" font-size="10" text-anchor="middle">localhost:8787/mcp</text>

    <text x="95" y="150" fill="#61C554" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">🛡️ Verifies Token</text>
    <text x="95" y="172" fill="#A1A1AA" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" text-anchor="middle">Reads authorized folder:</text>
    <rect x="15" y="185" width="160" height="28" rx="6" fill="#18181B" stroke="#22C55E"/>
    <text x="95" y="203" fill="#22C55E" font-family="monospace" font-size="9" text-anchor="middle">/Projects/my-project</text>
  </g>
</svg>
