<svg width="680" height="660" viewBox="0 0 680 660" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Window Shadow & Background -->
  <defs>
    <filter id="shadow" x="-20" y="-10" width="720" height="700" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-opacity="0.25"/>
    </filter>
    <linearGradient id="blueBtn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#007AFF"/>
      <stop offset="100%" stop-color="#0062D2"/>
    </linearGradient>
  </defs>

  <g filter="url(#shadow)">
    <!-- Window Frame -->
    <rect x="20" y="10" width="640" height="630" rx="12" fill="#282828" stroke="#3D3D3D" stroke-width="1"/>
    
    <!-- Titlebar -->
    <rect x="20" y="10" width="640" height="44" rx="12" fill="#1E1E1E"/>
    <rect x="20" y="42" width="640" height="12" fill="#1E1E1E"/>
    <line x1="20" y1="54" x2="660" y2="54" stroke="#333333" stroke-width="1"/>
    
    <!-- Traffic Lights -->
    <circle cx="42" cy="32" r="6" fill="#ED6A5E"/>
    <circle cx="62" cy="32" r="6" fill="#F4BF4F"/>
    <circle cx="82" cy="32" r="6" fill="#61C554"/>
    
    <!-- Window Title -->
    <text x="340" y="36" fill="#CCCCCC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica" font-size="13" font-weight="600" text-anchor="middle">CodexDev Configuration</text>
    
    <!-- Row 1: Auth Token -->
    <g transform="translate(0, 80)">
      <text x="170" y="16" fill="#A0A0A0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="500" text-anchor="end">MCP Auth Token:</text>
      <rect x="185" y="0" width="370" height="24" rx="5" fill="#1C1C1C" stroke="#3A3A3A" stroke-width="1"/>
      <text x="195" y="16" fill="#FFFFFF" font-family="monospace" font-size="12">••••••••••••••••••••••••••••••••••••••••</text>
      <circle cx="575" cy="12" r="9" fill="#3A3A3A"/>
      <text x="575" y="16" fill="#A0A0A0" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">?</text>
      <text x="187" y="38" fill="#777777" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">Secret token used to authenticate with your MCP server.</text>
    </g>

    <!-- Row 2: Project Root -->
    <g transform="translate(0, 155)">
      <text x="170" y="16" fill="#A0A0A0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="500" text-anchor="end">Project Root:</text>
      <rect x="185" y="0" width="310" height="24" rx="5" fill="#1C1C1C" stroke="#3A3A3A" stroke-width="1"/>
      <text x="195" y="16" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">/Users/developer/Projects</text>
      <rect x="505" y="0" width="80" height="24" rx="5" fill="#333333" stroke="#444444" stroke-width="1"/>
      <text x="545" y="16" fill="#E0E0E0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" text-anchor="middle">Choose...</text>
      <text x="187" y="38" fill="#777777" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">The main folder where your projects and codebase are stored.</text>
    </g>

    <!-- Row 3: Downloads Path -->
    <g transform="translate(0, 230)">
      <text x="170" y="16" fill="#A0A0A0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="500" text-anchor="end">Downloads Path:</text>
      <rect x="185" y="0" width="310" height="24" rx="5" fill="#1C1C1C" stroke="#3A3A3A" stroke-width="1"/>
      <text x="195" y="16" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">/Users/developer/Downloads</text>
      <rect x="505" y="0" width="80" height="24" rx="5" fill="#333333" stroke="#444444" stroke-width="1"/>
      <text x="545" y="16" fill="#E0E0E0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" text-anchor="middle">Choose...</text>
      <text x="187" y="38" fill="#777777" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">Where ChatGPT's pasted folders and archived files are saved.</text>
    </g>

    <!-- Row 4: Public Base URL -->
    <g transform="translate(0, 305)">
      <text x="170" y="16" fill="#A0A0A0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="500" text-anchor="end">Public Base URL:</text>
      <rect x="185" y="0" width="370" height="24" rx="5" fill="#1C1C1C" stroke="#3A3A3A" stroke-width="1"/>
      <text x="195" y="16" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">https://codex.yourdomain.com</text>
      <circle cx="575" cy="12" r="9" fill="#3A3A3A"/>
      <text x="575" y="16" fill="#A0A0A0" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">?</text>
      <text x="187" y="38" fill="#777777" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">Your public Cloudflare tunnel URL (e.g. https://codex.domain.com).</text>
    </g>

    <!-- Row 5: Tunnel Name -->
    <g transform="translate(0, 380)">
      <text x="170" y="16" fill="#A0A0A0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="500" text-anchor="end">Tunnel Name:</text>
      <rect x="185" y="0" width="400" height="24" rx="5" fill="#1C1C1C" stroke="#3A3A3A" stroke-width="1"/>
      <text x="195" y="16" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">codex-local</text>
      <text x="187" y="38" fill="#777777" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">The name of your Cloudflare tunnel (used in 'cloudflared run').</text>
    </g>

    <!-- Row 6: Cloudflared Path -->
    <g transform="translate(0, 455)">
      <text x="170" y="16" fill="#A0A0A0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="500" text-anchor="end">Cloudflared Path:</text>
      <rect x="185" y="0" width="310" height="24" rx="5" fill="#1C1C1C" stroke="#3A3A3A" stroke-width="1"/>
      <text x="195" y="16" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">/opt/homebrew/bin/cloudflared</text>
      <rect x="505" y="0" width="80" height="24" rx="5" fill="#333333" stroke="#444444" stroke-width="1"/>
      <text x="545" y="16" fill="#E0E0E0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" text-anchor="middle">Choose...</text>
      <circle cx="605" cy="12" r="9" fill="#3A3A3A"/>
      <text x="605" y="16" fill="#A0A0A0" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">?</text>
      <text x="187" y="38" fill="#777777" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">Absolute path to the cloudflared executable.</text>
    </g>

    <!-- Row 7: Node.js Path -->
    <g transform="translate(0, 530)">
      <text x="170" y="16" fill="#A0A0A0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="500" text-anchor="end">Node.js Path:</text>
      <rect x="185" y="0" width="310" height="24" rx="5" fill="#1C1C1C" stroke="#3A3A3A" stroke-width="1"/>
      <text x="195" y="16" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">/usr/local/bin/node</text>
      <rect x="505" y="0" width="80" height="24" rx="5" fill="#333333" stroke="#444444" stroke-width="1"/>
      <text x="545" y="16" fill="#E0E0E0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" text-anchor="middle">Choose...</text>
      <circle cx="605" cy="12" r="9" fill="#3A3A3A"/>
      <text x="605" y="16" fill="#A0A0A0" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">?</text>
      <text x="187" y="38" fill="#777777" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">Absolute path to the node executable.</text>
    </g>

    <!-- Bottom Buttons -->
    <rect x="40" y="595" width="150" height="30" rx="6" fill="#333333" stroke="#444444" stroke-width="1"/>
    <text x="115" y="614" fill="#CCCCCC" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="500" text-anchor="middle">How does this work?</text>

    <rect x="210" y="595" width="230" height="30" rx="6" fill="url(#blueBtn)"/>
    <text x="325" y="614" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Save &amp; Restart Services</text>
  </g>
</svg>
