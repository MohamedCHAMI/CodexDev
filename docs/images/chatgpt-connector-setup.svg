<svg width="680" height="520" viewBox="0 0 680 520" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="modalShadow" x="-20" y="-10" width="720" height="560" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-opacity="0.35"/>
    </filter>
    <linearGradient id="chatgptBtn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#10A37F"/>
      <stop offset="100%" stop-color="#0E8C6D"/>
    </linearGradient>
  </defs>

  <g filter="url(#modalShadow)">
    <!-- Modal Card -->
    <rect x="20" y="10" width="640" height="490" rx="14" fill="#202123" stroke="#343541" stroke-width="1.5"/>

    <!-- Modal Header -->
    <rect x="20" y="10" width="640" height="56" rx="14" fill="#2A2B32"/>
    <rect x="20" y="52" width="640" height="14" fill="#2A2B32"/>
    <line x1="20" y1="66" x2="660" y2="66" stroke="#3E3F4B" stroke-width="1"/>

    <!-- OpenAI Sparkle / Icon -->
    <circle cx="50" cy="38" r="14" fill="#10A37F"/>
    <path d="M45 38 L55 38 M50 33 L50 43" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>

    <text x="75" y="43" fill="#ECECF1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600">Connect CodexDev MCP Server</text>
    <circle cx="630" cy="38" r="10" fill="#343541"/>
    <text x="630" y="42" fill="#8E8EA0" font-family="sans-serif" font-size="12" text-anchor="middle">✕</text>

    <!-- Field 1: Connector Name -->
    <g transform="translate(50, 95)">
      <text x="0" y="0" fill="#D1D5DB" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600">CONNECTOR NAME</text>
      <rect x="0" y="10" width="580" height="38" rx="8" fill="#2D2F36" stroke="#4D4D4F" stroke-width="1"/>
      <text x="14" y="34" fill="#ECECF1" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13">CodexDev (Local Mac)</text>
    </g>

    <!-- Field 2: Server Endpoint URL -->
    <g transform="translate(50, 170)">
      <text x="0" y="0" fill="#D1D5DB" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600">MCP SERVER ENDPOINT URL</text>
      <rect x="0" y="10" width="580" height="38" rx="8" fill="#2D2F36" stroke="#4D4D4F" stroke-width="1"/>
      <text x="14" y="34" fill="#6EE7B7" font-family="monospace" font-size="13">https://codex.yourdomain.com/mcp</text>
      <text x="0" y="62" fill="#8E8EA0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">Your secure Cloudflare Tunnel endpoint generated by CodexDev.</text>
    </g>

    <!-- Field 3: Authentication -->
    <g transform="translate(50, 260)">
      <text x="0" y="0" fill="#D1D5DB" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600">AUTHENTICATION (BEARER TOKEN)</text>
      <rect x="0" y="10" width="580" height="38" rx="8" fill="#2D2F36" stroke="#4D4D4F" stroke-width="1"/>
      <text x="14" y="34" fill="#9CA3AF" font-family="monospace" font-size="13">••••••••••••••••••••••••••••••••••••••••</text>
      <rect x="525" y="16" width="45" height="26" rx="5" fill="#3E3F4B"/>
      <text x="547" y="33" fill="#D1D5DB" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" text-anchor="middle">Hide</text>
      <text x="0" y="62" fill="#8E8EA0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">Copy the MCP Auth Token from CodexDev Settings ⚙️ to authorize requests.</text>
    </g>

    <!-- Capabilities / Active Tools -->
    <g transform="translate(50, 350)">
      <text x="0" y="0" fill="#9CA3AF" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600">AVAILABLE LOCAL TOOLS:</text>
      
      <!-- Chip 1 -->
      <rect x="0" y="10" width="130" height="24" rx="12" fill="#1C382F" stroke="#10A37F" stroke-width="1"/>
      <text x="65" y="26" fill="#6EE7B7" font-family="monospace" font-size="10" text-anchor="middle">✓ list_directory</text>
      
      <!-- Chip 2 -->
      <rect x="140" y="10" width="105" height="24" rx="12" fill="#1C382F" stroke="#10A37F" stroke-width="1"/>
      <text x="192" y="26" fill="#6EE7B7" font-family="monospace" font-size="10" text-anchor="middle">✓ read_file</text>

      <!-- Chip 3 -->
      <rect x="255" y="10" width="105" height="24" rx="12" fill="#1C382F" stroke="#10A37F" stroke-width="1"/>
      <text x="307" y="26" fill="#6EE7B7" font-family="monospace" font-size="10" text-anchor="middle">✓ write_file</text>

      <!-- Chip 4 -->
      <rect x="370" y="10" width="150" height="24" rx="12" fill="#1C382F" stroke="#10A37F" stroke-width="1"/>
      <text x="445" y="26" fill="#6EE7B7" font-family="monospace" font-size="10" text-anchor="middle">✓ execute_command</text>
    </g>

    <!-- Footer Buttons & Status -->
    <line x1="20" y1="430" x2="660" y2="430" stroke="#343541" stroke-width="1"/>
    
    <g transform="translate(50, 455)">
      <!-- Status pill -->
      <circle cx="6" cy="8" r="4" fill="#10A37F"/>
      <text x="16" y="12" fill="#10A37F" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600">Ready to Connect</text>

      <!-- Cancel Button -->
      <rect x="380" y="-8" width="85" height="34" rx="6" fill="#2A2B32" stroke="#4D4D4F" stroke-width="1"/>
      <text x="422" y="14" fill="#D1D5DB" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="500" text-anchor="middle">Cancel</text>

      <!-- Connect Button -->
      <rect x="475" y="-8" width="115" height="34" rx="6" fill="url(#chatgptBtn)"/>
      <text x="532" y="14" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Save &amp; Connect</text>
    </g>
  </g>
</svg>
